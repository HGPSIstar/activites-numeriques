name: Déployer JupyterLite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - run: |
          jupyter lite build --contents content --output-dir dist/jupyter
          cp -a dist/jupyter dist/notebooks-python
          # JupyterLite peut garder en cache la liste des notebooks d’une publication précédente.
          release_dir="notebooks-${GITHUB_SHA:0:7}"
          cp -a dist/jupyter "dist/$release_dir"
          sed "s|href=\"notebooks-python/|href=\"$release_dir/|" index.html > dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
